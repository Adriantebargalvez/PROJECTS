<section class="collection-page monsters-page">
  <header class="collection-header">
    <p class="eyebrow">Bestiario oscuro</p>
    <h1>Monstruos</h1>
    <p>Enemigos y jefes presentados como cartas de alto impacto visual.</p>
  </header>

  <div class="luxury-grid">
    <article class="luxury-card violet-card" *ngFor="let monster of monsters">
      <div class="card-topline">
        <span>{{ monster.category }}</span>
        <span>#{{ monster.id }}</span>
      </div>

      <div class="image-frame">
        <img [src]="monster.image" [alt]="monster.name">
      </div>

      <div class="card-content">
        <h2>{{ monster.name }}</h2>
        <p class="description">{{ monster.description }}</p>

        <div class="detail-block" *ngIf="monster.common_locations as locations">
          <h3>Lugares</h3>
          <ul>
            <li *ngFor="let localidad of locations">{{ localidad }}</li>
          </ul>
        </div>

        <div class="detail-block" *ngIf="monster.drops as drops">
          <h3>Materiales</h3>
          <ul>
            <li *ngFor="let material of drops">{{ material }}</li>
          </ul>
        </div>
      </div>
    </article>
  </div>
</section>
