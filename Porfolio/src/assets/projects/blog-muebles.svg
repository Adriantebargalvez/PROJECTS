  <text x="300" y="444" fill="#241c17" font-family="Georgia, serif" font-size="78">espacios que</text>
  <text x="300" y="534" fill="#241c17" font-family="Georgia, serif" font-size="78">buscan</text>
  <text x="300" y="624" fill="#241c17" font-family="Georgia, serif" font-size="78">diferenciarse.</text>
  <text x="300" y="672" fill="#756b62" font-family="Inter, Arial" font-size="18">Seleccionamos sillas, mesas, piezas auxiliares y colecciones decorativas</text>
  <text x="300" y="704" fill="#756b62" font-family="Inter, Arial" font-size="18">con una mirada editorial para catálogos visuales de alto valor.</text>
