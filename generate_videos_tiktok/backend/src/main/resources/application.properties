spring.application.name=generate-videos-tiktok
server.port=8080

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=20GB

ffmpeg.path=${FFMPEG_PATH:ffmpeg}
ffprobe.path=${FFPROBE_PATH:ffprobe}

# Optional comma-separated allowlist. Example for Docker: VIDEO_ALLOWED_ROOTS=/data
video.allowed-roots=${VIDEO_ALLOWED_ROOTS:}

logging.file.name=logs/generate-videos-tiktok.log
logging.level.com.generatevideos.tiktok=INFO
