<section id="contact" class="bg-[#f3eadc] py-16 text-neutral-950 md:py-24">
  <div class="mx-auto grid max-w-7xl gap-8 px-5 md:grid-cols-[0.78fr_1fr] md:px-8">
    <div>
      <p class="text-sm font-bold uppercase tracking-[0.24em] text-[#8a6a2f]">{{ language.copy().catalog.contactEyebrow }}</p>
      <h2 class="mt-3 text-4xl font-semibold leading-tight md:text-5xl">{{ language.copy().catalog.contactTitle }}</h2>
      <p class="mt-5 text-lg leading-8 text-neutral-700">{{ language.copy().catalog.contactLead }}</p>
    </div>

    <form class="rounded-lg border border-black/10 bg-white p-5 shadow-sm md:p-7">
      <label class="block">
        <span class="text-sm font-bold text-neutral-700">{{ language.copy().catalog.nameLabel }}</span>
        <input class="mt-2 w-full rounded-md border border-neutral-300 px-4 py-3 outline-none transition focus:border-[#8a6a2f]" type="text" name="name" />
      </label>
      <label class="mt-5 block">
        <span class="text-sm font-bold text-neutral-700">{{ language.copy().catalog.emailLabel }}</span>
        <input class="mt-2 w-full rounded-md border border-neutral-300 px-4 py-3 outline-none transition focus:border-[#8a6a2f]" type="email" name="email" />
      </label>
      <label class="mt-5 block">
        <span class="text-sm font-bold text-neutral-700">{{ language.copy().catalog.messageLabel }}</span>
        <textarea
          class="mt-2 min-h-36 w-full rounded-md border border-neutral-300 px-4 py-3 outline-none transition focus:border-[#8a6a2f]"
          name="message"
          [value]="selectedMessage()"
        ></textarea>
      </label>
      <button type="button" class="mt-6 w-full rounded-md bg-neutral-950 px-5 py-4 text-sm font-bold text-white transition hover:bg-[#8a6a2f]">
        {{ language.copy().catalog.send }}
      </button>
    </form>
  </div>
</section>
